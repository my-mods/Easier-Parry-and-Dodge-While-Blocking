[Mod]
Id = oOCamilleOo_EasierParryAndDodgeWhileBlocking
Name = Easier Parry and Dodge While Blocking
Author = oOCamilleOo
Version = 1.4.1-dev
AuthorURL = https://www.nexusmods.com/users/933214
Description = Change settings here.

[Setting.enabled]
Id = enabled
Label = Parry timing adjustment
Group = General
Description = Enable the parry timing adjustment. Riposte direction and the dodge settings are independent.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.parryWindowPercent]
Id = parryWindowPercent
Label = Parry window
Group = Parry
Description = 100% is normal timing; 200% doubles the current difficulty-adjusted window. Choose from 20 percentages with closer spacing at low values and wider gaps at high values.
Type = picker
PresetValues = 10|25|50|75|100|125|150|175|200|250|300|400|500|750|1000|1500|2000|3000|4000|5000
PresetLabels = 10%|25%|50%|75%|100%|125%|150%|175%|200%|250%|300%|400%|500%|750%|1000%|1500%|2000%|3000%|4000%|5000%
Default = 200
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = parryWindowPercent

[Category.Parry]
VisibleWhen = enabled
VisibleValues = 1

[Setting.riposteDirection]
Id=riposteDirection
Type=picker
Label=Riposte direction
Group=Riposte
Description=Choose the red critical-riposte opening after a successful directional parry: the game's random direction, the opposite side of your block, or the same side. The normal skill requirements and opening duration still apply.
PresetValues=0|1|2
PresetLabels=Vanilla (Random)|Opposite direction|Same direction
Default=1
ConfigFile=settings.ini
ConfigSection=Settings
ConfigKey=riposteDirection


[Setting.dodgeWhileBlocking]
Id = dodgeWhileBlocking
Label = Dodge while blocking
Group = Dodge
Description = On enables dodge and guard recovery while holding block. Off restores vanilla dodge and guard behavior. Independent of parry timing. Any active dodge finishes before switching.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = dodgeWhileBlocking

[Setting.dodgeWindowPercent]
Id = dodgeWindowPercent
Label = Perfect dodge window
Group = Dodge
Description = 100% keeps normal perfect-dodge timing; 200% doubles the timing window. The game's direction and distance requirements still apply. Independent of parry timing and Dodge while blocking.
Type = picker
PresetValues = 10|25|50|75|100|125|150|175|200|250|300|400|500|750|1000|1500|2000|3000|4000|5000
PresetLabels = 10%|25%|50%|75%|100%|125%|150%|175%|200%|250%|300%|400%|500%|750%|1000%|1500%|2000%|3000%|4000%|5000%
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = dodgeWindowPercent

[Setting.dodgeInvulnerabilityWindowPercent]
Id = dodgeInvulnerabilityWindowPercent
Label = Dodge invulnerability window
Group = Dodge
Description = Scale normal and fatigued side/back dodge protection: 100% is normal, 25% is one quarter, 200% doubles it. Protection still ends when the dodge ends or is cancelled. Independent of perfect-dodge timing.
Type = picker
PresetValues = 25|50|75|100|125|150|175|200|250|300|400|500|750|1000|1500|2000|2500|3000|4000|5000
PresetLabels = 25%|50%|75%|100%|125%|150%|175%|200%|250%|300%|400%|500%|750%|1000%|1500%|2000%|2500%|3000%|4000%|5000%
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = dodgeInvulnerabilityWindowPercent

[Setting.debugLogging]
Id = debugLogging
Label = Logging
Group = Diagnostics
Description = Write troubleshooting details to UE4SS.log. Leave Off for normal play.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging
